name: build-test-publish

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - run: dotnet restore CineSched.slnx --locked-mode
      - run: dotnet build CineSched.slnx -c Release --no-restore -warnaserror
      - run: dotnet test tests/CineSched.Tests/CineSched.Tests.csproj -c Release --no-build --logger "trx;LogFileName=${{ matrix.os }}.trx" --collect:"XPlat Code Coverage"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: tests/CineSched.Tests/TestResults

  publish:
    name: Publish ${{ matrix.rid }}
    needs: build-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            os: ubuntu-24.04
            family: linux
          - rid: linux-arm64
            os: ubuntu-24.04-arm
            family: linux
          - rid: win-x64
            os: windows-2025
            family: windows
          - rid: win-arm64
            os: windows-11-arm
            family: windows
          - rid: osx-x64
            os: macos-15-intel
            family: macos
          - rid: osx-arm64
            os: macos-15
            family: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - run: dotnet restore src/CineSched.App/CineSched.App.csproj --locked-mode
      - run: >-
          dotnet publish src/CineSched.App/CineSched.App.csproj
          -c Release -f net10.0-desktop -r ${{ matrix.rid }}
          --self-contained true --no-restore
          -p:UseMonoRuntime=false
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:IncludeAllContentForSelfExtract=true
          -o artifacts/publish/${{ matrix.rid }}
      - name: Package Linux
        if: matrix.family == 'linux'
        shell: pwsh
        run: packaging/linux/build-appimage.ps1 -Rid ${{ matrix.rid }} -PublishDirectory artifacts/publish/${{ matrix.rid }} -OutputDirectory artifacts/packages
      - name: Package Windows
        if: matrix.family == 'windows'
        shell: pwsh
        run: packaging/windows/package.ps1 -Rid ${{ matrix.rid }} -PublishDirectory artifacts/publish/${{ matrix.rid }} -OutputDirectory artifacts/packages
      - name: Package macOS
        if: matrix.family == 'macos'
        shell: pwsh
        run: packaging/macos/package.ps1 -Rid ${{ matrix.rid }} -PublishDirectory artifacts/publish/${{ matrix.rid }} -OutputDirectory artifacts/packages
      - uses: actions/upload-artifact@v6
        with:
          name: CineSched-${{ matrix.rid }}
          path: artifacts/packages/*
          if-no-files-found: error
